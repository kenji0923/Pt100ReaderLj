# Pt100ReaderLj channel configuration
#
# vexc_v is the nominal global excitation and is useful for diagnostics only.
# RTD resistance is calculated from Rref * Vrtd / Vref, not from vexc_v.

schema_version: 1

global:
  vexc_v: 0.160

device:
  model: U6-Pro
  mux: Mux80
  serial: 360026137
  differential_range_v: 0.1
  differential_min_v: -0.106
  differential_max_v: 0.101
  overrange_margin_v: 0.0002
  gain_index: 2
  resolution_index: 12
  settling_factor: 0
  samples: 10
  minimum_drop_voltage_v: 0.001

sensors:
  - id: 1
    name: pt100_01
    enabled: true
    rref_ohms: 140.0
    rref_input: {positive: 48, negative: 56}
    rtd_input: {positive: 84, negative: 92}

